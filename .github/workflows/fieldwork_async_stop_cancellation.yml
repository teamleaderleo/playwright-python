name: Fieldwork async stop cancellation probe

on:
  pull_request:
    branches:
      - fieldwork/async-stop-cancellation-probe
  workflow_dispatch:

concurrency:
  group: fieldwork-async-stop-cancellation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted-test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.14"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install repository dependencies and driver
        run: |
          python -m pip install --upgrade pip
          pip install -r local-requirements.txt
          pip install -r requirements.txt
          pip install -e .
          python -m build --wheel
      - name: Run cancelled stop retry probe
        run: pytest tests/async/test_async_stop_cancellation.py --timeout 90
