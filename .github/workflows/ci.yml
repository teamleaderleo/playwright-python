name: CI

on:
  pull_request:
    branches:
      - release-*

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  unit-08:
    name: Unit 08 exact-head gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Python 3.10
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
    - name: Python 3.10 repository gate and lifecycle tests
      run: |
        python -m pip install --upgrade pip
        pip install -r local-requirements.txt
        pip install -r requirements.txt
        pip install -e .
        rm -rf dist
        python -m build --wheel
        pre-commit run --show-diff-on-failure --color=always --all-files
        pytest tests/async/test_async_stop_cancellation.py tests/async/test_async_stop_exit_contract.py --timeout 20 --reruns 0 -vv --tb=long

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Python 3.12 lifecycle tests
      run: |
        python -m pip install --upgrade pip
        pip install -r local-requirements.txt
        pip install -r requirements.txt
        pip install -e .
        rm -rf dist
        python -m build --wheel
        pytest tests/async/test_async_stop_cancellation.py tests/async/test_async_stop_exit_contract.py --timeout 20 --reruns 0 -vv --tb=long

    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - name: Python 3.14 lifecycle tests
      run: |
        python -m pip install --upgrade pip
        pip install -r local-requirements.txt
        pip install -r requirements.txt
        pip install -e .
        rm -rf dist
        python -m build --wheel
        pytest tests/async/test_async_stop_cancellation.py tests/async/test_async_stop_exit_contract.py --timeout 20 --reruns 0 -vv --tb=long

    - name: Tracked diff hygiene
      run: |
        git diff --check
        test -z "$(git status --short --untracked-files=no)"
