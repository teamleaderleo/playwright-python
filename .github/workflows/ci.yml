name: CI

on:
  pull_request:
    branches:
      - release-*

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  focused:
    name: Unit 08 / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies and assemble driver
      run: |
        python -m pip install --upgrade pip
        pip install -r local-requirements.txt
        pip install -r requirements.txt
        pip install -e .
        python -m build --wheel
    - name: Repository pre-commit gate
      if: matrix.python-version == '3.10'
      run: pre-commit run --show-diff-on-failure --color=always --all-files
    - name: Focused async shutdown lifecycle tests
      run: >-
        pytest
        tests/async/test_async_stop_cancellation.py
        tests/async/test_async_stop_exit_contract.py
        --timeout 20
        --reruns 0
        -vv
        --tb=long
    - name: Tracked diff hygiene
      run: |
        git diff --check
        test -z "$(git status --short --untracked-files=no)"
